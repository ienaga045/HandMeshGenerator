<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hand Base Mesh Generator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="capture-source" aria-hidden="true">
        <video id="camera-video" playsinline muted autoplay></video>
      </div>

      <section class="card preview-card">
        <canvas id="bone-preview" width="560" height="420"></canvas>
      </section>

      <section class="card controls-card">
        <h1>Hand Base Mesh Generator</h1>

        <div class="choice-row">
          <label><input id="hand-right" type="radio" name="target-hand" value="Right" checked> 右手</label>
          <label><input id="hand-left" type="radio" name="target-hand" value="Left"> 左手</label>
        </div>

        <div class="camera-controls">
          <label>
            Camera
            <select id="camera-select">
              <option value="">Default / In Camera</option>
            </select>
          </label>
          <label>
            Facing
            <select id="facing-mode">
              <option value="user">In camera</option>
              <option value="environment">Rear camera</option>
            </select>
          </label>
        </div>

        <fieldset class="preset-box">
          <legend>プリセット</legend>
          <div class="preset-grid">
            <button type="button" class="preset-button" data-preset="standard">標準</button>
            <button type="button" class="preset-button" data-preset="wide">幅広</button>
            <button type="button" class="preset-button" data-preset="thickPalm">甲高</button>
            <button type="button" class="preset-button" data-preset="slim">細め</button>
            <button type="button" class="preset-button" data-preset="longFinger">指長め</button>
            <button type="button" class="preset-button" data-preset="smallJoint">球小</button>
          </div>
        </fieldset>

        <fieldset class="adjust-box">
          <legend>調整</legend>
          <label class="slider-row">
            <span>指の長さ</span>
            <input id="finger-length" type="range" min="70" max="140" step="5">
          </label>
          <label class="slider-row">
            <span>指の太さ</span>
            <input id="finger-width" type="range" min="50" max="180" step="5">
          </label>
          <label class="slider-row">
            <span>球の大きさ</span>
            <input id="joint-radius" type="range" min="40" max="160" step="5">
          </label>
          <label class="slider-row">
            <span>甲の厚さ</span>
            <input id="palm-thickness" type="range" min="40" max="160" step="5">
          </label>
        </fieldset>

        <div class="action-row">
          <button id="start-camera" type="button" class="secondary-action">カメラ開始</button>
          <button id="stop-camera" type="button" class="secondary-action" disabled>停止</button>
          <button id="capture-camera" type="button" class="secondary-action" disabled>撮影</button>
        </div>

        <div class="action-row final-actions">
          <button id="download" type="button" class="primary-action" disabled>OBJ作成・保存</button>
          <button id="reset" type="button" class="reset-action">リセット</button>
        </div>

        <p id="status" class="status">Ready</p>
        <p class="privacy-note">Camera images are processed only in this browser and are not saved on a server.</p>
      </section>
    </main>

    <script type="module" src="main.js?v=20260620-camera-fallback"></script>
  </body>
</html>
